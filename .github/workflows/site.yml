name: testes e site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  montar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: paginas de cada vaga, sitemap e robots
        run: python -m hub paginas
      - name: versao nos arquivos (o navegador nao mistura CSS/JS antigo com HTML novo)
        run: |
          v=$(echo "$GITHUB_SHA" | cut -c1-8)
          find site -name '*.html' -exec sed -i -E "s/(estilo\.css|app\.js|newsletter\.js)\"/\1?v=$v\"/g" {} +
          grep -rho 'estilo\.css?v=[a-z0-9]*' site | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
