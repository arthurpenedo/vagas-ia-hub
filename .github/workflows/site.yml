name: coleta e site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 10 * * *"   # todo dia às 7h30 de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  coleta:
    if: github.event_name != 'push'
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m hub coletar
      - name: salvar vagas
        run: |
          git config user.name "coleta-automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vagas.json coletas.log
          git diff --cached --quiet || git commit -m "vagas: coleta automatica $(date -u +%F)"
          git push

  site:
    needs: [testes, coleta]
    if: always() && needs.testes.result == 'success' && needs.coleta.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
